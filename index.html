<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCard URL生成</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght=300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="#000000" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter">
                    <rect x="3" y="4" width="18" height="18" rx="0" ry="0"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                連絡先URL・QRジェネレーター
            </h1>
            <p class="subtitle">連絡先情報を入力してQRコード用のURLを発行します。</p>
        </header>

        <main class="form-container">
            <div class="card glass">
                <h2>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    基本情報
                </h2>
                
                <form id="vcard-form">
                    <div class="form-group">
                        <label for="name">名前 <span class="required">*</span></label>
                        <input type="text" id="name" name="name" placeholder="例: 山田 太郎" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="company">会社名</label>
                        <input type="text" id="company" name="company" placeholder="例: 株式会社サンプル">
                    </div>

                    <div class="form-group">
                        <label for="tel">電話番号 <span class="required">*</span></label>
                        <input type="tel" id="tel" name="tel" placeholder="例: 090-1234-5678" required>
                    </div>

                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" placeholder="例: taro@example.com">
                    </div>

                    <button type="submit" class="btn submit-btn">URLを生成・圧縮する</button>
                </form>
            </div>

            <div id="result-section" class="card glass hidden">
                <h2>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                    生成されたURL
                </h2>
                <p class="help-text">このURLをコピーして、Adobe ExpressのQRコード作成機能に貼り付けてください。</p>
                <div class="copy-group">
                    <input type="text" id="generated-url" readonly>
                    <button type="button" id="copy-btn" class="btn secondary-btn">コピー</button>
                </div>
                <p id="copy-msg" class="success-msg hidden">クリップボードにコピーしました</p>
                <a id="preview-link" href="#" target="_blank" class="preview-link">プロフィール画面をプレビュー</a>
            </div>
        </main>
    </div>

    <script src="script-index.js"></script>
</body>
</html>
